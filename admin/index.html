<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>傑克電機 行政服務入口</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F7FB;color:#14213D;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .l{text-align:center;padding:24px;font-size:15px;line-height:1.7}
  .s{width:36px;height:36px;margin:0 auto 14px;border:4px solid #DBE5F7;border-top-color:#0064F3;border-radius:50%;animation:r .9s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  a{color:#0064F3}
</style>
</head>
<body>
<div class="l" id="l"><div class="s"></div>傑克電機 行政服務入口<br><small>載入中…</small></div>
<script>
/* 行政服務入口：畫面與資料都由 Apps Script 提供，這個檔案只負責載入，平常不用修改。 */
(function () {
  var API = 'https://script.google.com/a/macros/jaker.com.tw/s/AKfycbzV_WQ7PIykmOIIF0Q-xrp_bxKaKiE195c_YB7qgvwvDINYWpKERU70uW__CpmgBbJV/exec';
  var q = new URLSearchParams(location.search);
  var page = (q.get('page') || 'home').replace(/[^a-z0-9]/gi, '');
  var otp = (q.get('otp') || '').replace(/[^0-9a-f]/gi, '');
  if (page === '3d') { show3d(); return; }
  /* 3D 廠區用到 google.script.run，不能像其他頁面一樣直接載入，改成整頁內嵌，網址維持在公司網址 */
  function show3d() {
    document.title = '傑克電機 3D 廠區';
    document.body.style.cssText = 'margin:0;display:block;min-height:0;height:100vh;height:100dvh;overflow:hidden';
    var f = document.createElement('iframe');
    f.src = API + location.search;
    f.title = '3D 廠區';
    f.allow = 'fullscreen';
    f.style.cssText = 'border:0;display:block;width:100%;height:100%';
    document.body.innerHTML = '';
    document.body.appendChild(f);
    /* 3D 頁載入後會通知這裡，這裡把行政服務入口的登入代碼傳過去（同事人物、預約資料要登入才看得到） */
    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (x) { return; }
      if (!/\.googleusercontent\.com$/.test(host) || !e.data || e.data.type !== 'jk3d-ready' || !e.source) return;
      var t = '';
      try { t = localStorage.getItem('jaker.token') || ''; } catch (x) { t = ''; }
      if (t) e.source.postMessage({ type: 'jaker-token', token: t }, e.origin);
    });
  }
  var url = API + '?shell=1&page=' + encodeURIComponent(page) + (otp ? '&otp=' + otp : '');
  fetch(url, { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (html) {
      if (html.indexOf('window.__PAGE__') < 0) throw new Error('bad');
      /* 入口已搬到 work.jaker.com.tw/admin：頁面裡舊的 admin.jaker.com.tw 連結改指到新網址 */
      html = html.split('https://admin.jaker.com.tw/').join(location.origin + '/admin/').split('http://admin.jaker.com.tw/').join(location.origin + '/admin/');
      /* 一次性登入代碼用過就從網址拿掉，避免被轉傳 */
      if (otp) history.replaceState(null, '', location.pathname + '?page=' + page + (q.get('bind') ? '&bind=1' : ''));
      document.open(); document.write(html); document.close();
    })
    .catch(function () {
      document.getElementById('l').innerHTML = '目前無法載入，請稍後重新整理。<br><a href="' + API + '?page=' + page + '">改用備用網址開啟</a>';
    });
})();
</script>
</body>
</html>
